name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # O runner ubuntu-latest já traz o Android SDK em /usr/local/lib/android/sdk
      # (ANDROID_HOME pré-definido e licenças aceitas). O AGP baixa o compileSdk
      # e build-tools que faltarem automaticamente.

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # AGP 8.7.3 requer Gradle 8.9+; sem wrapper, instala esta versão.
          gradle-version: 8.11.1

      - name: Rodar testes unitários
        # Gate de qualidade: parser de períodos da CVM, calibração do score
        # (teto de PEGY/Value Trap/ROE, exceção bancária) e consistência
        # aritmética do raio-X. Falha aqui bloqueia o APK.
        run: gradle testDebugUnitTest --no-daemon

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v5
        with:
          name: lynch-screener-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
