name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner ubuntu-latest já traz o Android SDK em /usr/local/lib/android/sdk
      # (ANDROID_HOME pré-definido e licenças aceitas). O AGP baixa o compileSdk
      # e build-tools que faltarem automaticamente.

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.7.3 requer Gradle 8.9+; sem wrapper, instala esta versão.
          gradle-version: 8.11.1

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: lynch-screener-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
